name: nr-probe (temporary)
on:
  push:
    branches: [claude/project-thread-xklwdq]
    paths: [.github/workflows/nr-probe.yml, tcs/sources/nr_schedule.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -e .
      - name: Pick a real train for every GB route
        env:
          NETWORK_RAIL_USERNAME: ${{ secrets.NETWORK_RAIL_USERNAME }}
          NETWORK_RAIL_PASSWORD: ${{ secrets.NETWORK_RAIL_PASSWORD }}
        run: |
          python - <<'PY'
          import time
          from tcs.config import list_routes, load_settings
          from tcs.sources import nr_schedule
          for r in list_routes():
              if r["country"] == "US":
                  continue
              s = load_settings(route_id=r["id"])
              before = dict(s.route["timetable"]["calls"])
              t0 = time.time()
              got = nr_schedule.apply(s)
              print(f"== {r['id']} ({time.time() - t0:.0f}s)")
              print("   route file:", before)
              if got:
                  print("   network rail:", got["toc"], got["train"], got["uid"], got["calls"])
                  stations = [x["crs"] for x in s.route["stations"]]
                  print("   route stations it calls at:", [c for c in stations if c in got["stops"]], " passes:", [c for c in stations if c not in got["stops"]])
          PY
