name: publish

# Rebuilds every route from the live feeds and publishes the viewer to Cloudflare (a Workers static-assets site,
# configured in wrangler.jsonc), where a Cloudflare Access application decides who can open it. Runs on the 17th
# of each month, and whenever you press "Run workflow" on the Actions tab.
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions); docs/hosting.md walks through them:
#   OFCOM_API_KEY, OPENCELLID_TOKEN       the same keys as your local .env
#   CLOUDFLARE_API_TOKEN                  a token with Account -> Workers Scripts -> Edit
#   CLOUDFLARE_ACCOUNT_ID                 from the Cloudflare dashboard
#
# Nothing is published, and the previous version stays live, if: the Ofcom API refuses a test call up front (its
# call quota is used up), any route fails to build, or less than 90 % of any GB route's coverage is live Ofcom data.
# US routes (config/countries/US) take no Ofcom data: their coverage comes from OpenCellID, and a US route built on
# stand-ins is reported in the run summary without holding back the publish.
# A full rebuild makes about 18,000 Ofcom calls (one per postcode near the track), so run it at most once per quota
# period: this key's quota was used up on 26 Sep 2026 and resets around the 16th, hence the 17th below.
#
# US routes are built side by side, one job each (the `us` job below: about 20 minutes a route, 43 routes), and handed to
# the publish job as artifacts; GB routes are built in the publish job, which needs the Ofcom quota and its cache.
#
# "Run workflow" also takes a list of route ids (e.g. tpe_man_ncl) to rebuild just those. Such a run does not publish,
# since the runner holds only those routes and publishing would drop the rest: it uploads their bundles, evidence packs
# included, as the run's "route-bundles" artifact, to drop into web/public/data/ next to the others and deploy from there.

on:
  schedule:
    - cron: "17 3 17 * *"   # 03:17 UTC on the 17th of every month, just after the Ofcom quota resets
  workflow_dispatch:
    inputs:
      routes:
        description: "Route ids to rebuild on their own, comma-separated (e.g. tpe_man_ncl). Leave empty to rebuild and publish every route."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # runs that publish queue one behind another; a selected-routes run (never publishes) goes alongside them
  group: ${{ inputs.routes && format('build-{0}', github.run_id) || 'publish' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Pick the routes to build
    runs-on: ubuntu-latest
    env:
      ROUTES: ${{ inputs.routes || '' }}
    outputs:
      us: ${{ steps.pick.outputs.us }}
      gb: ${{ steps.pick.outputs.gb }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - id: pick
        shell: python
        run: |
          import json, os
          from tcs.config import list_routes
          wanted = {x.strip() for x in os.environ["ROUTES"].split(",") if x.strip()}
          routes = [r for r in list_routes() if not wanted or r["id"] in wanted]
          unknown = sorted(wanted - {r["id"] for r in routes})
          if unknown:
              raise SystemExit(f"::error::Unknown route id(s): {', '.join(unknown)}")
          us = [r["id"] for r in routes if r["country"] == "US"]
          gb = [r["id"] for r in routes if r["country"] != "US"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"us={json.dumps(us)}\n")
              fh.write(f"gb={','.join(gb)}\n")
          print(f"US: {len(us)} route(s), GB: {len(gb)} route(s)")

  us:
    name: Build ${{ matrix.route }}
    needs: plan
    if: needs.plan.outputs.us != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        route: ${{ fromJSON(needs.plan.outputs.us) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      # Read-only: forty-odd jobs saving their downloads would push the shared cache (and its Ofcom answers) out of
      # GitHub's 10 GB cache limit.
      - name: Restore downloads from recent runs
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: raw-
      - name: Build the route from the live feeds
        env:
          OPENCELLID_TOKEN: ${{ secrets.OPENCELLID_TOKEN }}
          FCC_BDC_USERNAME: ${{ secrets.FCC_BDC_USERNAME }}
          FCC_BDC_TOKEN: ${{ secrets.FCC_BDC_TOKEN }}
        run: tcs run --route "${{ matrix.route }}"
      - name: Build its evidence packs
        run: |
          if ! tcs report-all --only "${{ matrix.route }}"; then
            echo "::warning::The evidence packs for ${{ matrix.route }} failed to build; it is published without a Report download."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: us-bundle-${{ matrix.route }}
          path: web/public/data/${{ matrix.route }}/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Rebuild routes from live feeds and publish
    needs: [plan, us]
    # US routes that failed are reported below and left out; they never hold back the GB routes or the publish
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350   # a full rebuild is mostly Ofcom API calls (about one per corridor postcode): roughly 5 h
    env:
      ROUTES: ${{ inputs.routes || '' }}   # empty on the monthly schedule: every route
      GB_ROUTES: ${{ needs.plan.outputs.gb }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check the secrets are set
        env:
          OFCOM_API_KEY: ${{ secrets.OFCOM_API_KEY }}
          OPENCELLID_TOKEN: ${{ secrets.OPENCELLID_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          for s in OFCOM_API_KEY OPENCELLID_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see docs/hosting.md)"; exit 1; fi

      - run: pip install -e .

      # One test call before hours of work: when the Ofcom call quota is used up, every route would silently fall
      # back to stand-in coverage, so stop here and keep the current site.
      - name: Check the Ofcom API still has call quota
        if: env.GB_ROUTES != ''
        env:
          OFCOM_API_KEY: ${{ secrets.OFCOM_API_KEY }}
        run: |
          if ! out=$(tcs probe-ofcom N1C4TB 2>&1); then
            echo "$out" | tail -n 4
            echo "::error::The Ofcom API refused a test call (usually its monthly call quota is used up). Nothing was rebuilt or published; the current site stays live. Run the workflow again once the quota resets."
            exit 1
          fi

      # Downloads and Ofcom answers from a run in the past week are reused, so re-running a failed publish is cheap.
      # Restore and save are separate steps so a failed run (e.g. the quota ran out part-way) still keeps what it
      # fetched; the all-in-one cache action only saves after a successful job.
      - name: Restore downloads and Ofcom answers from recent runs
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: raw-

      - name: Rebuild the GB routes from the live feeds
        if: env.GB_ROUTES != ''
        env:
          OFCOM_API_KEY: ${{ secrets.OFCOM_API_KEY }}
          OPENCELLID_TOKEN: ${{ secrets.OPENCELLID_TOKEN }}
        run: tcs build-all --only "$GB_ROUTES"

      - name: Collect the US routes built alongside
        if: needs.plan.outputs.us != '[]'
        uses: actions/download-artifact@v4
        with:
          pattern: us-bundle-*
          path: web/public/data/
      - name: List the routes for the viewer
        run: |
          for d in web/public/data/us-bundle-*; do [ -d "$d" ] && mv "$d" "web/public/data/${d#web/public/data/us-bundle-}"; done
          python -c "from tcs.cli import write_index; print(write_index())"
          if [ "${{ needs.us.result }}" = "failure" ]; then
            echo "::warning::Some US routes failed to build (see the us jobs); they are left out of this run."
          fi

      # Saved from main only. A cache is ~2.5 GB and the repository keeps 10 GB, so test runs on other
      # branches saving theirs pushed out main's and a publish then had to ask Ofcom again for every postcode (8 Oct 2026).
      # Runs on other branches still restore main's.
      - name: Keep this run's downloads and Ofcom answers, even if the rebuild failed
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}-${{ github.run_attempt }}

      # Each route's model inputs and outputs (route samples, coverage, serving cells, predictions; not the raw downloads)
      # for calibrating and validating the model against field measurements, which never come to GitHub. Kept for 7 days.
      - name: Keep each route's model data for calibration and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-data
          path: |
            data/interim/
            data/processed/
          retention-days: 7
          if-no-files-found: ignore

      - name: Summarise which feeds each route used
        if: always()
        shell: python
        run: |
          import glob, json, os
          from tcs.report import LIVE_COVERAGE_MIN, is_gb, live_coverage_share
          rows, degraded, no_coverage = [], [], []
          for path in sorted(glob.glob("web/public/data/*/meta.json")):
              m = json.load(open(path, encoding="utf-8"))
              share = live_coverage_share(m)
              cov = f"{share:.0%} {'Ofcom' if is_gb(m) else 'FCC / OpenCellID sites'} ({', '.join(m.get('coverage_sources') or []) or '-'})"
              legs = m.get("geometry_straight_legs") or []   # OSM legs with no rail path, drawn straight
              track = f"{m.get('geometry_source')}" + (f" (straight: {', '.join(legs)})" if legs else "")
              terrain = f"{m.get('terrain_source')}" + (f" + LiDAR {m['lidar_share']:.0%}" if m.get("lidar_share") else "")
              fm = m.get("fitted_masts") or {}
              sites = f"{m.get('cell_source')}" + (f" + {fm['masts']} fitted masts ({fm['serving_share']:.0%} serving)" if fm.get("masts") else "")
              cells = [track, terrain, cov, sites]
              rows.append("| " + " | ".join([m["route"]["id"], *map(str, cells)]) + " |")
              if any("synthetic" in str(c) for c in cells) or share < LIVE_COVERAGE_MIN or legs:
                  degraded.append(m["route"]["id"])
              if share < LIVE_COVERAGE_MIN and is_gb(m):   # also catches a quota that ran out part-way through a route
                  no_coverage.append(m["route"]["id"])
          out = ["## Feeds used per route", "", "| route | track | terrain | coverage | cell sites |", "|---|---|---|---|---|", *rows]
          if degraded:
              out += ["", f"{len(degraded)} route(s) used stand-in data for at least one feed: {', '.join(degraded)}."]
              print(f"::warning::Stand-in data used for: {', '.join(degraded)}")
          if no_coverage:
              # Coverage is the core input: publishing stand-ins would replace good live data on the site.
              out += ["", f"**Not published:** less than {LIVE_COVERAGE_MIN:.0%} of the coverage is live Ofcom data for {', '.join(no_coverage)} "
                          "(usually the Ofcom call quota ran out part-way). The current site stays live."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(out) + "\n")
          if no_coverage:
              print(f"::error::Less than {LIVE_COVERAGE_MIN:.0%} live Ofcom coverage for: {', '.join(no_coverage)}. Not publishing.")
              raise SystemExit(1)

      # Word report + Excel appendix per route for the baseline and EDGE Rail + Fleet Connect scenarios, placed beside
      # each route bundle for the viewer's Report button. Re-simulates from the data just built: no API calls.
      # A pack that fails to build does not hold back the publish; that route's Report menu says it has no pack.
      - name: Build the evidence packs for the Report button
        if: env.GB_ROUTES != ''
        run: |
          if ! tcs report-all --only "$GB_ROUTES"; then
            echo "::warning::Some evidence packs failed to build (see the log above); those routes are published without a Report download."
          fi

      # A selected-routes run stops here: its bundles go to an artifact instead of the site (see the header).
      - name: Hand over the rebuilt routes instead of publishing
        if: env.ROUTES != ''
        uses: actions/upload-artifact@v4
        with:
          name: route-bundles
          path: |
            web/public/data/
            !web/public/data/index.json
          retention-days: 7
          if-no-files-found: error

      - name: Build the viewer
        if: env.ROUTES == ''
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish to Cloudflare
        if: env.ROUTES == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy   # uploads web/dist as configured in wrangler.jsonc
