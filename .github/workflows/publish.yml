name: publish

# Rebuilds every route from the live feeds and publishes the viewer to Cloudflare (a Workers static-assets site,
# configured in wrangler.jsonc), where a Cloudflare Access application decides who can open it. Runs on the 17th
# of each month, and whenever you press "Run workflow" on the Actions tab.
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions); docs/hosting.md walks through them:
#   OFCOM_API_KEY, OPENCELLID_TOKEN       the same keys as your local .env
#   CLOUDFLARE_API_TOKEN                  a token with Account -> Workers Scripts -> Edit
#   CLOUDFLARE_ACCOUNT_ID                 from the Cloudflare dashboard
#
# Nothing is published, and the previous version stays live, if: the Ofcom API refuses a test call up front (its
# call quota is used up), any route fails to build, or less than 90 % of any route's coverage is live Ofcom data.
# A full rebuild makes about 18,000 Ofcom calls (one per postcode near the track), so run it at most once per quota
# period: this key's quota was used up on 26 Sep 2026 and resets around the 16th, hence the 17th below.

on:
  schedule:
    - cron: "17 3 17 * *"   # 03:17 UTC on the 17th of every month, just after the Ofcom quota resets
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Rebuild routes from live feeds and publish
    runs-on: ubuntu-latest
    timeout-minutes: 350   # a full rebuild is mostly Ofcom API calls (about one per corridor postcode): roughly 5 h
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check the secrets are set
        env:
          OFCOM_API_KEY: ${{ secrets.OFCOM_API_KEY }}
          OPENCELLID_TOKEN: ${{ secrets.OPENCELLID_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          for s in OFCOM_API_KEY OPENCELLID_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see docs/hosting.md)"; exit 1; fi

      - run: pip install -e .

      # One test call before hours of work: when the Ofcom call quota is used up, every route would silently fall
      # back to stand-in coverage, so stop here and keep the current site.
      - name: Check the Ofcom API still has call quota
        env:
          OFCOM_API_KEY: ${{ secrets.OFCOM_API_KEY }}
        run: |
          if ! out=$(tcs probe-ofcom N1C4TB 2>&1); then
            echo "$out" | tail -n 4
            echo "::error::The Ofcom API refused a test call (usually its monthly call quota is used up). Nothing was rebuilt or published; the current site stays live. Run the workflow again once the quota resets."
            exit 1
          fi

      # Downloads and Ofcom answers from a run in the past week are reused, so re-running a failed publish is cheap.
      # Restore and save are separate steps so a failed run (e.g. the quota ran out part-way) still keeps what it
      # fetched; the all-in-one cache action only saves after a successful job.
      - name: Restore downloads and Ofcom answers from recent runs
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: raw-

      - name: Rebuild every route from the live feeds
        env:
          OFCOM_API_KEY: ${{ secrets.OFCOM_API_KEY }}
          OPENCELLID_TOKEN: ${{ secrets.OPENCELLID_TOKEN }}
        run: tcs build-all

      - name: Keep this run's downloads and Ofcom answers, even if the rebuild failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarise which feeds each route used
        if: always()
        shell: python
        run: |
          import glob, json, os
          from tcs.report import LIVE_COVERAGE_MIN, live_coverage_share
          rows, degraded, no_coverage = [], [], []
          for path in sorted(glob.glob("web/public/data/*/meta.json")):
              m = json.load(open(path, encoding="utf-8"))
              share = live_coverage_share(m)
              cov = f"{share:.0%} Ofcom ({', '.join(m.get('coverage_sources') or []) or '-'})"
              legs = m.get("geometry_straight_legs") or []   # OSM legs with no rail path, drawn straight
              track = f"{m.get('geometry_source')}" + (f" (straight: {', '.join(legs)})" if legs else "")
              cells = [track, m.get("terrain_source"), cov, m.get("cell_source")]
              rows.append("| " + " | ".join([m["route"]["id"], *map(str, cells)]) + " |")
              if any("synthetic" in str(c) for c in cells) or share < LIVE_COVERAGE_MIN or legs:
                  degraded.append(m["route"]["id"])
              if share < LIVE_COVERAGE_MIN:   # also catches a quota that ran out part-way through a route
                  no_coverage.append(m["route"]["id"])
          out = ["## Feeds used per route", "", "| route | track | terrain | coverage | cell sites |", "|---|---|---|---|---|", *rows]
          if degraded:
              out += ["", f"{len(degraded)} route(s) used stand-in data for at least one feed: {', '.join(degraded)}."]
              print(f"::warning::Stand-in data used for: {', '.join(degraded)}")
          if no_coverage:
              # Coverage is the core input: publishing stand-ins would replace good live data on the site.
              out += ["", f"**Not published:** less than {LIVE_COVERAGE_MIN:.0%} of the coverage is live Ofcom data for {', '.join(no_coverage)} "
                          "(usually the Ofcom call quota ran out part-way). The current site stays live."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(out) + "\n")
          if no_coverage:
              print(f"::error::Less than {LIVE_COVERAGE_MIN:.0%} live Ofcom coverage for: {', '.join(no_coverage)}. Not publishing.")
              raise SystemExit(1)

      # Word report + Excel appendix per route for the baseline and EDGE Rail + Fleet Connect scenarios, placed beside
      # each route bundle for the viewer's Report button. Re-simulates from the data just built: no API calls.
      # A pack that fails to build does not hold back the publish; that route's Report menu says it has no pack.
      - name: Build the evidence packs for the Report button
        run: |
          if ! tcs report-all; then
            echo "::warning::Some evidence packs failed to build (see the log above); those routes are published without a Report download."
          fi

      - name: Build the viewer
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy   # uploads web/dist as configured in wrangler.jsonc
