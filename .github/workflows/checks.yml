name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  web:
    name: Viewer typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  parity:
    name: Browser model vs Python parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e .
      - run: npm ci
        working-directory: web
      - name: Build the reference route offline (synthetic sources, no keys, no network)
        run: tcs run --offline
      - name: Python model outputs for every policy x vehicle profile x weather
        run: python tests/parity_expected.py --out "$RUNNER_TEMP/parity_expected.json"
      - name: Browser model (web/src/sim/model.ts) must reproduce them
        working-directory: web
        run: npm run test:parity -- "$RUNNER_TEMP/parity_expected.json"
