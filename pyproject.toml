[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "train-connectivity-sim"
version = "0.1.0"
description = "Route-agnostic, time-aware simulation of onboard train connectivity (cellular + satcom) with 3D rendering."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "duckdb>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "geopandas>=1.0",
  "rasterio>=1.3",
  "networkx>=3.2",
  "requests>=2.31",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1.0",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pdfplumber>=0.11", "scipy>=1.11"]
# aa/ (active antenna modelling) and scripts/: reading vendor antenna reports, curve fits
aa = ["pdfplumber>=0.11", "scipy>=1.11"]
# `tcs locate-masts`: placing masts from scanner logs (building routes only reads the result)
fit = ["scipy>=1.11"]

[project.scripts]
tcs = "tcs.cli:app"

[tool.setuptools.packages.find]
include = ["tcs*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Syntax errors, pyflakes (undefined names, unused imports/variables) and import order. Pinned so newer ruff releases,
# whose default rule set is much wider, do not change what CI enforces; the codebase deliberately uses compact
# one-line statements.
select = ["E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]                     # aa/ is a folder of tools beside the tcs package
