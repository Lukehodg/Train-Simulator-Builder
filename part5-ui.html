<script>
(function(){
'use strict';
const {CFG, TUNNELS, LINKS, REASONS, CLASS_NAMES, WIFI_CLASSES, R, S, SITES, simulate, classOf, confStep, clamp, explain, unproj} = window.__SIM;
const SC=window.__SCENE, N=R.n, $=id=>document.getElementById(id);
const CRS=['KGX','SVG','PBO','GRA','NNG','RET','DON','YRK','NTR','DAR','DHM','NCL','MPT','ALM','BWK','DUN','EDB'];
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const idxAtKm=km=>clamp(Math.round(km/CFG.spacing_km),0,N-1);
const state={ t:R.t[idxAtKm(395)], playing:!reduced, speed:20, metric:'quality', hoverKm:null };
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const clsVar=['--c-strong','--c-usable','--c-poor','--c-outage','--c-unknown'];
const confVar=['--conf-1','--conf-2','--conf-3','--conf-4','--conf-5'];
const CONF_LABELS=['unknown','0.10–0.39 sparse / synthetic','0.40–0.69 prediction','0.70–0.89 calibrated','0.90–1.00 measured'];
function indexAtTime(t){ let lo=0,hi=N-1; while(lo<hi){ const m=(lo+hi+1)>>1; if(R.t[m]<=t) lo=m; else hi=m-1; } return lo; }
const fmtClock=t=>{ const s=Math.floor(9*3600+t); const h=Math.floor(s/3600)%24, m=Math.floor(s/60)%60, ss=s%60; return [h,m,ss].map(v=>String(v).padStart(2,'0')).join(':'); };
const fmtHM=t=>{ const s=Math.floor(9*3600+t); return String(Math.floor(s/3600)%24).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0'); };

/* ---------- live panel ---------- */
const rows={};
{ const host=$('linkRows'); for(const L of LINKS){ const name=document.createElement('div'); name.className='name'; name.textContent=L.name;
    const cls=document.createElement('span'); cls.className='cls'; const bar=document.createElement('div'); bar.className='bar'; const fill=document.createElement('i'); bar.appendChild(fill);
    const val=document.createElement('div'); val.className='val'; host.append(name,cls,bar,val); rows[L.id]={name,cls,fill,val}; } }
function envText(i){ const t=R.tunnel[i]; if(t>=0) return TUNNELS[t][2]+' tunnel'; if(R.canopy[i]>=0.9) return 'station canopy'; if(R.cutting[i]>8) return 'cutting '+R.cutting[i].toFixed(0)+' m'; if(R.urban[i]>0.5) return 'urban'; return 'open'; }
function updateLive(i){
  $('lvSpeed').innerHTML=Math.round(R.v[i]*3.6)+'<small>km/h</small>';
  $('lvDist').textContent=R.km[i].toFixed(1)+' km from origin';
  const next=R.stations.find(s=>s.stop&&s.i>i+2); $('lvNext').textContent=next?next.name:'—'; $('lvEta').textContent=next?fmtHM(R.t[next.i]):'arrived';
  $('lvElev').textContent=R.elev[i].toFixed(0)+' m'; $('lvEnv').textContent=envText(i);
  for(const L of LINKS){ const o=S.links[L.id], r=rows[L.id], c=classOf('quality',L.id,i), on=!!(S.active[i]&(1<<LINKS.indexOf(L)));
    r.cls.textContent=CLASS_NAMES[c]; r.cls.style.borderLeftColor=cssVar(clsVar[c]); r.fill.style.width=clamp(o.cap[i]/250*100,0,100)+'%'; r.fill.style.background=cssVar(clsVar[c]);
    r.val.textContent=o.avail[i]?Math.round(o.cap[i])+' Mbps · '+Math.round(o.lat[i])+' ms':(L.id==='sl'?REASONS[o.reason[i]]:'no service');
    r.name.textContent=(on?'● ':'○ ')+L.name; for(const k in r) r[k].classList.toggle('off',!on); }
  const act=LINKS.filter((L,k)=>S.active[i]&(1<<k)).map(L=>L.name); $('wanActive').textContent=act.length?act.join(' + '):'none';
  $('wanCap').textContent=act.length?Math.round(S.bonded[i])+' Mbps':'—'; $('wanLat').textContent=act.length?Math.round(S.lat[i])+' ms':'—'; $('wanLoss').textContent=act.length?S.loss[i].toFixed(1)+' %':'—';
  $('wanUser').textContent=act.length?S.perUser[i].toFixed(1)+' Mbps × '+Math.round(S.passengers[i]*CFG.wifi.active_share)+' active':'—';
  $('wifiScore').innerHTML=Math.round(S.wifi[i])+'<small>/100</small>'; const wc=S.wifiClass[i]; const pill=$('wifiClass'); pill.textContent=WIFI_CLASSES[wc]; pill.style.borderLeftColor=cssVar(clsVar[wc<=1?0:wc-1]);
  $('wanConf').textContent=S.conf[i].toFixed(2);
}

/* ---------- legend ---------- */
function updateLegend(){ const el=$('legend'); el.innerHTML='';
  const items = state.metric==='conf' ? confVar.map((v,k)=>[v,CONF_LABELS[k]]) : [['--c-strong',{quality:'Strong (q ≥ 0.6)',capacity:'≥ 50 Mbps',latency:'≤ 45 ms',loss:'≤ 0.5 %',avail:'Available',wifi:'Excellent / good'}[state.metric]],
    ['--c-usable',{quality:'Usable',capacity:'20–50 Mbps',latency:'45–80 ms',loss:'0.5–2 %',avail:'',wifi:'Usable'}[state.metric]],['--c-poor',{quality:'Poor',capacity:'5–20 Mbps',latency:'80–150 ms',loss:'2–5 %',avail:'',wifi:'Poor'}[state.metric]],
    ['--c-outage',{quality:'Outage',capacity:'< 5 Mbps',latency:'> 150 ms',loss:'> 5 %',avail:'Unavailable',wifi:'Outage'}[state.metric]]].filter(x=>x[1]);
  for(const [v,label] of items){ const s=document.createElement('span'); const i=document.createElement('i'); i.style.background=cssVar(v); s.append(i,label); el.appendChild(s); } }

/* ---------- timeline (distance axis, one strip per link, bonded Mbps line on the Wi-Fi strip) ---------- */
const tl=$('tl'), tctx=tl.getContext('2d'); const base=document.createElement('canvas'); let W=0,H=0,DPR=1; const GL=64, GR=10, AX=20;
const LANESPEC=[['wan','Wi-Fi · bonded'],['ee','EE'],['o2','O2'],['vf','Vodafone'],['sl','Starlink']];
function laneGeom(){ const top=8, gap=3, h1=42, h=16; const lanes=[]; let y=top; LANESPEC.forEach(([k],n)=>{ const hh=n===0?h1:h; lanes.push({key:k,y,h:hh}); y+=hh+gap; }); return {lanes, axisY:y+2}; }
const kmToX=km=>GL+(km/CFG.route_km)*(W-GL-GR), xToKm=x=>clamp((x-GL)/(W-GL-GR)*CFG.route_km,0,CFG.route_km);
function drawBase(){ const r=tl.getBoundingClientRect(); DPR=Math.min(devicePixelRatio,2); W=r.width; H=r.height; tl.width=base.width=W*DPR; tl.height=base.height=H*DPR;
  const c=base.getContext('2d'); c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,W,H); const {lanes,axisY}=laneGeom(); const text=cssVar('--text'), muted=cssVar('--muted'), border=cssVar('--border');
  const cls=clsVar.map(cssVar), conf=confVar.map(cssVar); const perPx=CFG.route_km/(W-GL-GR);
  c.font='600 11px "Barlow Condensed", "Arial Narrow", sans-serif'; c.textBaseline='middle';
  for(const ln of lanes){ c.fillStyle=muted; c.textAlign='right'; c.fillText(LANESPEC.find(l=>l[0]===ln.key)[1].toUpperCase(), GL-8, ln.y+ln.h/2);
    let runStart=GL, runCol=null; const cols=W-GL-GR;
    for(let px=0;px<=cols;px++){ let col=null; if(px<cols){ const k0=idxAtKm(px*perPx), k1=idxAtKm((px+1)*perPx); let worst=-1, cv=1;
        for(let i=k0;i<=k1;i++){ if(state.metric==='conf'){ cv=Math.min(cv, ln.key==='wan'?S.conf[i]:S.links[ln.key].conf[i]); } else { worst=Math.max(worst, classOf(state.metric, ln.key, i)); } }
        col = state.metric==='conf' ? conf[confStep(cv)] : cls[worst]; }
      if(col!==runCol){ if(runCol){ c.fillStyle=runCol; c.fillRect(runStart, ln.y, GL+px-runStart, ln.h); } runStart=GL+px; runCol=col; } }
  }
  // bonded capacity line over the Wi-Fi strip (0–250 Mbps)
  { const ln=lanes[0]; c.beginPath(); for(let px=0;px<W-GL-GR;px++){ const i=idxAtKm(px*perPx); const y=ln.y+ln.h-2-clamp(S.bonded[i]/250,0,1)*(ln.h-4); px?c.lineTo(GL+px,y):c.moveTo(GL+px,y); }
    c.strokeStyle=cssVar('--surface'); c.lineWidth=3; c.stroke(); c.strokeStyle=text; c.lineWidth=1.5; c.stroke(); }
  // axis: stations (CRS codes), tunnels
  c.strokeStyle=border; c.beginPath(); c.moveTo(GL,axisY); c.lineTo(W-GR,axisY); c.stroke();
  c.font='500 10px "IBM Plex Mono", monospace'; c.textAlign='center'; let lastX=-100;
  R.stations.forEach((s,k)=>{ const x=kmToX(s.km); c.strokeStyle=border; c.beginPath(); c.moveTo(x,8); c.lineTo(x,axisY+3); c.stroke(); if(x-lastX>26){ c.fillStyle=s.stop?text:muted; c.fillText(CRS[k], x, axisY+11); lastX=x; } });
  c.fillStyle=muted; for(const [a,b] of TUNNELS){ c.fillRect(kmToX(a)-1, axisY-4, Math.max(2,kmToX(b)-kmToX(a)), 4); }
  c.textAlign='right'; c.fillText('km', GL-8, axisY+11);
}
function drawTimeline(i){ tctx.setTransform(1,0,0,1,0,0); tctx.clearRect(0,0,tl.width,tl.height); tctx.drawImage(base,0,0); tctx.setTransform(DPR,0,0,DPR,0,0);
  const {axisY}=laneGeom(); const x=kmToX(R.km[i]); tctx.strokeStyle=cssVar('--accent'); tctx.lineWidth=1.5; tctx.beginPath(); tctx.moveTo(x,4); tctx.lineTo(x,axisY); tctx.stroke();
  tctx.fillStyle=cssVar('--accent'); tctx.beginPath(); tctx.moveTo(x-5,2); tctx.lineTo(x+5,2); tctx.lineTo(x,8); tctx.closePath(); tctx.fill();
  if(state.hoverKm!=null){ const hx=kmToX(state.hoverKm); tctx.strokeStyle=cssVar('--muted'); tctx.setLineDash([3,3]); tctx.beginPath(); tctx.moveTo(hx,4); tctx.lineTo(hx,axisY); tctx.stroke(); tctx.setLineDash([]); } }
tl.addEventListener('pointermove', e=>{ const r=tl.getBoundingClientRect(); const x=e.clientX-r.left; if(x<GL||x>W-GR){ state.hoverKm=null; $('tlTip').style.display='none'; return; }
  state.hoverKm=xToKm(x); const i=idxAtKm(state.hoverKm); const tip=$('tlTip'); const cls=clsVar.map(cssVar);
  let html='<div class="row"><span>'+R.km[i].toFixed(1)+' km · '+fmtHM(R.t[i])+'</span><b>'+envText(i)+'</b></div>';
  html+='<div class="row"><span><i style="background:'+cls[[0,0,1,2,3][S.wifiClass[i]]]+'"></i>Wi-Fi '+WIFI_CLASSES[S.wifiClass[i]]+'</span><b>'+Math.round(S.bonded[i])+' Mbps</b></div>';
  for(const L of LINKS){ const o=S.links[L.id], c=classOf('quality',L.id,i); html+='<div class="row"><span><i style="background:'+cls[c]+'"></i>'+L.name+' '+CLASS_NAMES[c]+'</span><b>'+(o.avail[i]?Math.round(o.cap[i])+' Mbps':REASONS[o.reason[i]]||'—')+'</b></div>'; }
  tip.innerHTML=html; tip.style.display='block'; const tw=tip.offsetWidth; tip.style.left=Math.min(W-tw-4, Math.max(0, x-tw/2))+'px'; tip.style.top='-4px'; tip.style.transform='translateY(-100%)'; });
tl.addEventListener('pointerleave', ()=>{ state.hoverKm=null; $('tlTip').style.display='none'; });
tl.addEventListener('click', e=>{ const r=tl.getBoundingClientRect(); const x=e.clientX-r.left; if(x>=GL&&x<=W-GR) seek(R.t[idxAtKm(xToKm(x))]); });
new ResizeObserver(()=>{ drawBase(); }).observe(tl);

/* ---------- inspection popup ---------- */
const pop=$('pop');
function showPopup(i, px, py){ const [lat,lon]=unproj(R.x[i],R.y[i]); const cls=clsVar.map(cssVar); const stationIdx=R.stationNear[i];
  const near=stationIdx>=0?' · '+R.stations[stationIdx].name:''; const row=(k,v)=>'<tr><td>'+k+'</td><td>'+v+'</td></tr>';
  let h='<h4><span>Sample #'+i+' · '+R.km[i].toFixed(2)+' km'+near+'</span><button type="button" id="popClose" aria-label="Close">✕</button></h4><table>';
  h+=row('Position', lat.toFixed(4)+', '+lon.toFixed(4))+row('Elevation', R.elev[i].toFixed(0)+' m (terrain '+R.terrain[i].toFixed(0)+' m)')+row('Environment', envText(i))+row('Sim time', fmtClock(R.t[i])+' · '+Math.round(R.v[i]*3.6)+' km/h');
  for(const L of LINKS){ const o=S.links[L.id], c=classOf('quality',L.id,i); h+='<tr><td class="sec" colspan="2">'+L.name+' <span style="color:'+cls[c]+'">■</span> '+CLASS_NAMES[c]+'</td></tr>';
    if(L.type==='cellular'){ const s=SITES[L.id][o.serving[i]]; h+=row('Quality score', o.q[i].toFixed(2))+row('RSRP (synthetic)', o.rsrp[i].toFixed(0)+' dBm')+row('Capacity / latency', Math.round(o.cap[i])+' Mbps / '+Math.round(o.lat[i])+' ms')+row('Est. serving cell', 'cell '+s.cellId+' · '+Math.hypot(s.x-R.x[i],s.y-R.y[i]).toFixed(1)+' km'+(o.ho[i]?' · handover':''))+row('Confidence', o.conf[i].toFixed(2)); }
    else { h+=row('Sky visibility', o.q[i].toFixed(2))+row('Available', o.avail[i]?'yes':'no · '+REASONS[o.reason[i]])+row('Capacity / latency', Math.round(o.cap[i])+' Mbps / '+Math.round(o.lat[i])+' ms')+row('Confidence', o.conf[i].toFixed(2)); } }
  h+='<tr><td class="sec" colspan="2">Onboard WAN · '+S.params.policy.toLowerCase().replace(/_/g,' ')+'</td></tr>'+row('Bonded / latency / loss', Math.round(S.bonded[i])+' Mbps / '+Math.round(S.lat[i])+' ms / '+S.loss[i].toFixed(1)+' %')+row('Wi-Fi score', Math.round(S.wifi[i])+' · '+WIFI_CLASSES[S.wifiClass[i]])+row('Confidence', S.conf[i].toFixed(2));
  h+='</table><div class="why"><b>Model reasoning</b>';
  for(const L of LINKS){ h+='<div style="margin-top:4px"><b>'+L.name+'</b>'; for(const [k,v] of explain(L.id,i)) h+='<div class="row" style="display:flex;justify-content:space-between;gap:8px"><span>'+k+'</span><code>'+v+'</code></div>'; h+='</div>'; }
  h+='<div style="margin-top:6px">source_flags <code>synthetic_prior|synthetic_cells|starlink_predictive_obstruction</code> · model <code>'+CFG.model_version+'</code></div></div>';
  pop.innerHTML=h; pop.classList.add('show'); const vw=$('viewport').clientWidth, vh=$('viewport').clientHeight; pop.style.left=Math.min(vw-pop.offsetWidth-10, Math.max(10,px+12))+'px'; pop.style.top=Math.min(vh-pop.offsetHeight-10, Math.max(10,py-20))+'px';
  $('popClose').onclick=hidePopup; }
function hidePopup(){ pop.classList.remove('show'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ hidePopup(); $('aboutBox').classList.remove('show'); } if(e.key===' '&&e.target===document.body){ e.preventDefault(); togglePlay(); } });
window.__UI={showPopup, hidePopup};

/* ---------- transport ---------- */
function togglePlay(){ state.playing=!state.playing; $('playIcon').setAttribute('d', state.playing?'M2 1h3v10H2zM7 1h3v10H7z':'M2 1l9 5-9 5z'); }
$('play').addEventListener('click', togglePlay); if(state.playing) $('playIcon').setAttribute('d','M2 1h3v10H2zM7 1h3v10H7z');
$('speeds').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; state.speed=+b.dataset.x; document.querySelectorAll('#speeds button').forEach(x=>x.classList.toggle('on',x===b)); });
let scrubbing=false; const scrub=$('scrub');
scrub.addEventListener('input', ()=>{ scrubbing=true; state.t=scrub.value/10000*R.duration; }); scrub.addEventListener('change', ()=>{ scrubbing=false; });
function seek(t){ state.t=clamp(t,0,R.duration); }
{ const sel=$('jump'); R.stations.forEach((s,k)=>{ const o=document.createElement('option'); o.value=k; o.textContent=s.name; sel.appendChild(o); }); sel.value=''; sel.addEventListener('change', ()=>{ const s=R.stations[+sel.value]; seek(Math.max(0,R.t[s.i]-40)); }); }
for(const k of ['ee','o2','vf','sl','wan']) $('ly_'+k).addEventListener('change', e=>SC.setLayer(k, e.target.checked));
$('metric').addEventListener('change', e=>{ state.metric=e.target.value; SC.setMetric(state.metric); drawBase(); updateLegend(); });
for(const k of ['policy','vehicle','weather']) $(k).addEventListener('change', e=>{ S.params[k]=e.target.value; simulate(); SC.recolor(); drawBase(); });
$('aboutBtn').addEventListener('click', ()=>$('aboutBox').classList.toggle('show'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ drawBase(); updateLegend(); });
new MutationObserver(()=>{ drawBase(); updateLegend(); }).observe(document.documentElement,{attributes:true, attributeFilter:['data-theme']});

/* ---------- main loop ---------- */
let last=performance.now(), liveAt=0;
function frame(now){ const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(state.playing){ state.t+=dt*state.speed; if(state.t>=R.duration){ state.t=R.duration; state.playing=false; $('playIcon').setAttribute('d','M2 1l9 5-9 5z'); } }
  const i=indexAtTime(state.t); const j=Math.min(N-1,i+1); const frac=j>i?clamp((state.t-R.t[i])/(R.t[j]-R.t[i]),0,1):0;
  SC.updateScene(i, frac, dt);
  if(now-liveAt>120){ liveAt=now; updateLive(i); $('clock').textContent=fmtClock(state.t); if(!scrubbing) scrub.value=Math.round(state.t/R.duration*10000); drawTimeline(i); }
  requestAnimationFrame(frame); }
drawBase(); updateLegend(); requestAnimationFrame(frame);
})();
</script>
