<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ================= configuration (simulation.yaml equivalent) ================= */
const CFG = {
  route_km: 632.2, spacing_km: 0.05, v_exag: 8,
  wan: { bonding_efficiency: 0.82, congestion_factor: 0.9, minimum_link_score: 0.25 },
  handover: { samples: 6, latency_spike_ms: 80, packet_loss: 2.0, capacity_factor: 0.6 },
  wifi: { passengers: 420, active_share: 0.35, per_user_demand_mbps: 1.5, ap_capacity_mbps: 300 },
  model_version: 'mock-0.1'
};
// name, lat, lon, stop?, trainshed?
const STATIONS = [
  ["London King's Cross",51.5308,-0.1238,true,true],
  ['Stevenage',51.9017,-0.2069,false,false],
  ['Peterborough',52.5746,-0.2500,true,false],
  ['Grantham',52.9111,-0.6420,false,false],
  ['Newark North Gate',53.0817,-0.7986,false,false],
  ['Retford',53.3153,-0.9475,false,false],
  ['Doncaster',53.5220,-1.1400,false,false],
  ['York',53.9581,-1.0931,true,true],
  ['Northallerton',54.3330,-1.4410,false,false],
  ['Darlington',54.5205,-1.5474,true,true],
  ['Durham',54.7793,-1.5817,false,false],
  ['Newcastle',54.9683,-1.6174,true,true],
  ['Morpeth',55.1622,-1.6828,false,false],
  ['Alnmouth',55.3927,-1.6367,false,false],
  ['Berwick-upon-Tweed',55.7742,-2.0110,true,false],
  ['Dunbar',55.9985,-2.5139,false,false],
  ['Edinburgh Waverley',55.9520,-3.1883,true,true]
];
// km from, km to, name, dedicated in-tunnel cellular (assumption)
const TUNNELS = [[0.4,1.2,'Gasworks & Copenhagen',true],[34.9,35.4,'Welwyn North',false],[36.0,36.5,'Welwyn South',false],[160.7,161.6,'Stoke',false],[173.9,174.8,'Peascliffe',false],[631.2,631.8,'Calton',true]];
// synthetic rural weak zones: centre km, half-width km, depth
const DIPS = [[148,20,0.22],[335,18,0.18],[505,35,0.34],[578,25,0.28],[262,10,0.14]];
// line speed (km/h) restrictions: from, to, speed
const LINE = [[0,3,50],[3,12,110],[12,30,160],[33,38,130],[120,125,110],[190,196,140],[248,252,100],[300,306,80],[374,378,100],[409,414,110],[428,436,60],[539,544,90],[610,626,130],[626,633,60]];
const LINKS = [
  {id:'ee', name:'EE',       type:'cellular', capMax:160, seed:11, dipF:0.85, lane:1},
  {id:'o2', name:'O2',       type:'cellular', capMax:95,  seed:23, dipF:1.15, lane:2},
  {id:'vf', name:'Vodafone', type:'cellular', capMax:120, seed:37, dipF:1.0,  lane:3},
  {id:'sl', name:'Starlink', type:'satcom',   capMax:230, seed:0,  dipF:0,    lane:0}
];
const REASONS = ['OPEN_SKY','TUNNEL','DEEP_CUTTING','STATION_CANOPY','URBAN_OBSTRUCTION','TEMPORARY_HANDOVER','WEATHER_PENALTY','SERVICE_UNAVAILABLE'];
const CLASS_NAMES = ['STRONG','USABLE','POOR','OUTAGE','UNKNOWN'];
const WIFI_CLASSES = ['EXCELLENT','GOOD','USABLE','POOR','OUTAGE'];

/* ================= noise ================= */
const hash = n => { const s = Math.sin(n) * 43758.5453; return s - Math.floor(s); };
function noise1(x, seed){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); return hash(i*1.37+seed*911.3)*(1-u)+hash((i+1)*1.37+seed*911.3)*u; }
function fbm1(x, seed, oct){ let a=0.5,s=0,f=1,n=0; for(let o=0;o<oct;o++){ s+=a*noise1(x*f, seed+o*17); n+=a; a*=0.5; f*=2.1; } return s/n; }
const hash2 = (x,y) => hash(x*127.1 + y*311.7);
function noise2(x,y){ const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy, ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
  const a=hash2(ix,iy), b=hash2(ix+1,iy), c=hash2(ix,iy+1), d=hash2(ix+1,iy+1);
  return (a*(1-ux)+b*ux)*(1-uy)+(c*(1-ux)+d*ux)*uy; }
function fbm2(x,y,oct){ let a=0.5,s=0,f=1,n=0; for(let o=0;o<oct;o++){ s+=a*noise2(x*f+o*3.1,y*f-o*7.3); n+=a; a*=0.55; f*=2; } return s/n; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ================= geography: projection + terrain ================= */
const LAT0=51.5308, LON0=-0.1238, KX=111.32*Math.cos(53.7*Math.PI/180), KY=110.57;
const proj = (lat,lon) => [ (lon-LON0)*KX, (lat-LAT0)*KY ];   // km east, km north
function terrainM(x,y){
  const pennine = Math.max(0, 1-Math.hypot((x+150)/80,(y-300)/150));
  const cheviot = Math.max(0, 1-Math.hypot((x+124)/38,(y-444)/32));
  const lammer  = Math.max(0, 1-Math.hypot((x+163)/45,(y-478)/26));
  const fens    = Math.max(0, 1-Math.hypot((x-20)/45,(y-115)/45));
  const base = 15 + 50*fbm2(x/45,y/45,3) + 150*fbm2(x/11,y/11,5)*(0.35+0.65*fbm2(x/70,y/70,2));
  return Math.max(2, base*(1-0.8*fens) + 420*pennine + 520*cheviot + 380*lammer);
}

/* ================= route: spline through stations, 50 m samples ================= */
const R = {};                 // route_samples.parquet equivalent
(function buildRoute(){
  const ctrl = [];
  const pts = STATIONS.map(s => proj(s[1],s[2]));
  for (let i=0;i<pts.length;i++){
    ctrl.push(new THREE.Vector3(pts[i][0],0,-pts[i][1]));
    if (i<pts.length-1){
      const [ax,ay]=pts[i], [bx,by]=pts[i+1];
      const dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy), nx=-dy/L, ny=dx/L;
      for (let k=1;k<=3;k++){ const t=k/4, w=(hash(i*7+k)-0.5)*Math.min(4,L*0.08);
        ctrl.push(new THREE.Vector3(ax+dx*t+nx*w,0,-(ay+dy*t+ny*w))); }
    }
  }
  const curve = new THREE.CatmullRomCurve3(ctrl,false,'centripetal',0.5);
  curve.arcLengthDivisions = 6000;
  const N = Math.round(CFG.route_km/CFG.spacing_km)+1;
  R.n=N; R.x=new Float32Array(N); R.y=new Float32Array(N); R.km=new Float32Array(N);
  R.bearing=new Float32Array(N); R.terrain=new Float32Array(N); R.elev=new Float32Array(N);
  R.cutting=new Float32Array(N); R.tunnel=new Int8Array(N); R.canopy=new Float32Array(N); R.urban=new Float32Array(N);
  R.stationNear=new Int16Array(N).fill(-1);
  for (let i=0;i<N;i++){ const p=curve.getPointAt(i/(N-1)); R.x[i]=p.x; R.y[i]=-p.z; R.km[i]=i*CFG.spacing_km; }
  for (let i=0;i<N;i++){ const a=Math.max(0,i-1), b=Math.min(N-1,i+1); R.bearing[i]=Math.atan2(R.x[b]-R.x[a], R.y[b]-R.y[a]); }
  // stations -> nearest sample
  R.stations = STATIONS.map((s,si)=>{ const [px,py]=pts[si]; let best=0,bd=1e9;
    for (let i=0;i<N;i+=4){ const d=(R.x[i]-px)**2+(R.y[i]-py)**2; if(d<bd){bd=d;best=i;} }
    return {name:s[0], stop:s[3], shed:s[4], i:best, km:R.km[best], x:R.x[best], y:R.y[best]}; });
  // terrain + smoothed railway profile (railway sits in cuttings / on embankments)
  for (let i=0;i<N;i++) R.terrain[i]=terrainM(R.x[i],R.y[i]);
  const W=30; let acc=0; const pre=new Float32Array(N+1); for(let i=0;i<N;i++){acc+=R.terrain[i];pre[i+1]=acc;}
  for (let i=0;i<N;i++){ const a=Math.max(0,i-W), b=Math.min(N,i+W+1); R.elev[i]=(pre[b]-pre[a])/(b-a); }
  for (let pass=0;pass<2;pass++){ for(let i=1;i<N;i++) R.elev[i]=clamp(R.elev[i],R.elev[i-1]-0.75,R.elev[i-1]+0.75);
                                  for(let i=N-2;i>=0;i--) R.elev[i]=clamp(R.elev[i],R.elev[i+1]-0.75,R.elev[i+1]+0.75); }
  const bigCity = [[0,26,1],[2,6,0.6],[6,6,0.55],[7,7,0.65],[11,12,0.85],[16,18,1]]; // station idx, radius km, strength
  for (let i=0;i<N;i++){
    const km=R.km[i];
    R.cutting[i]=Math.max(0,R.terrain[i]-R.elev[i]);
    R.tunnel[i]=-1; for(let t=0;t<TUNNELS.length;t++) if(km>=TUNNELS[t][0]&&km<=TUNNELS[t][1]) R.tunnel[i]=t;
    let u=0; for(const [si,r,s] of bigCity){ const d=Math.abs(km-R.stations[si].km); u=Math.max(u, s*Math.max(0,1-d/r)); }
    R.urban[i]=u;
    let c=0; for(const s of R.stations){ const d=Math.abs(km-s.km); if(s.shed&&d<0.3) c=1; if(!s.shed&&d<0.12) c=0.35; if(d<0.6) R.stationNear[i]=R.stations.indexOf(s); }
    R.canopy[i]=c;
  }
  // speed profile + simulated clock (Version 1: line speed + accel/decel + dwell)
  const ds=CFG.spacing_km*1000, A=0.5, B=0.7; R.v=new Float32Array(N); R.t=new Float64Array(N);
  const lineV = km => { let v=200; for(const [a,b,s] of LINE) if(km>=a&&km<b) v=Math.min(v,s); return v/3.6; };
  const stopIdx=new Set(R.stations.filter(s=>s.stop).map(s=>s.i));
  R.v[0]=0; for(let i=1;i<N;i++){ R.v[i]=stopIdx.has(i)?0:Math.min(lineV(R.km[i]), Math.sqrt(R.v[i-1]**2+2*A*ds)); }
  for(let i=N-2;i>=0;i--){ R.v[i]=Math.min(R.v[i], Math.sqrt(R.v[i+1]**2+2*B*ds)); }
  R.t[0]=0; for(let i=1;i<N;i++){ const vm=Math.max(1.2,(R.v[i-1]+R.v[i])/2); R.t[i]=R.t[i-1]+ds/vm+(stopIdx.has(i)&&i<N-1?120:0); }
  R.duration=R.t[N-1];
})();

/* ================= synthetic cell sites (OpenCellID stand-in) ================= */
const SITES = {}; // per cellular link: [{x,y,km,cellId}]
(function buildSites(){
  let cid=1000;
  for (const L of LINKS){ if(L.type!=='cellular') continue; const arr=[]; let d=1.5+hash(L.seed)*2;
    while(d<CFG.route_km){ const i=Math.min(R.n-1,Math.round(d/CFG.spacing_km)); const u=R.urban[i];
      const rural=1-u; const off=(hash(L.seed*3+d)-0.5)*2*(1.2+3.5*rural); const nx=Math.cos(R.bearing[i]), ny=-Math.sin(R.bearing[i]);
      arr.push({x:R.x[i]+nx*off, y:R.y[i]+ny*off, km:d, cellId:cid++, elev:terrainM(R.x[i]+nx*off,R.y[i]+ny*off)});
      d += 2.2 + 5.5*rural + hash(L.seed*5+d)*3.5; }
    SITES[L.id]=arr; }
})();

/* ================= simulation core ================= */
const S = { links:{}, params:{policy:'PACKET_BONDING', vehicle:'EXTERNAL_ROOFTOP_ANTENNA', weather:'nominal'} };
for (const L of LINKS){ const N=R.n; S.links[L.id]={ q:new Float32Array(N), cap:new Float32Array(N), lat:new Float32Array(N), loss:new Float32Array(N),
  avail:new Uint8Array(N), conf:new Float32Array(N), reason:new Uint8Array(N), serving:new Int32Array(N).fill(-1), ho:new Uint8Array(N), score:new Float32Array(N), rsrp:new Float32Array(N), sinr:new Float32Array(N) }; }
Object.assign(S, { bonded:new Float32Array(R.n), lat:new Float32Array(R.n), loss:new Float32Array(R.n), active:new Uint8Array(R.n), wifi:new Float32Array(R.n),
  wifiClass:new Uint8Array(R.n), perUser:new Float32Array(R.n), conf:new Float32Array(R.n), passengers:new Float32Array(R.n) });

function dip(km, f){ let d=0; for(const [c,w,depth] of DIPS){ const z=Math.abs(km-c)/w; if(z<1) d=Math.max(d, depth*(1-z*z)); } return d*f; }

function simulate(){
  const N=R.n, P=S.params, H=CFG.handover;
  const handset = P.vehicle==='PASSENGER_HANDSET_INSIDE_CARRIAGE';
  // --- cellular links ---
  for (const L of LINKS){ if(L.type!=='cellular') continue; const o=S.links[L.id], sites=SITES[L.id]; let serving=-1, si=0, hoLeft=0;
    for (let i=0;i<N;i++){
      const km=R.km[i];
      while (si<sites.length-1 && sites[si+1].km<km) si++;
      // Level B: candidate cells (window around si), nearest wins with hysteresis
      let best=-1,bd=1e9; for(let k=Math.max(0,si-2);k<=Math.min(sites.length-1,si+3);k++){ const d=Math.hypot(sites[k].x-R.x[i],sites[k].y-R.y[i]); if(d<bd){bd=d;best=k;} }
      if (serving<0) serving=best; else if (best!==serving){ const cd=Math.hypot(sites[serving].x-R.x[i],sites[serving].y-R.y[i]); if(bd<cd*0.78||cd>9){ serving=best; hoLeft=H.samples; } }
      const sd=Math.hypot(sites[serving].x-R.x[i],sites[serving].y-R.y[i]);
      // Level A: prior + terrain + rail environment + vehicle loss
      let q = 0.62 + 0.25*(fbm1(km/5, L.seed, 4)*2-1) + 0.22*R.urban[i] - dip(km, L.dipF)
            - 0.28*Math.min(1, R.cutting[i]/10) - 0.06*Math.max(0, sd-3) - (handset?0.18:0);
      const tun=R.tunnel[i]; if(tun>=0) q = TUNNELS[tun][3] ? 0.52 : 0.04;
      q=clamp(q,0,1);
      const ho = hoLeft>0; if(hoLeft>0) hoLeft--;
      o.q[i]=q; o.rsrp[i]=-120+46*q; o.sinr[i]=-5+30*q; o.serving[i]=serving; o.ho[i]=ho?1:0;
      const jitter=0.8+0.4*noise1(km/0.3, L.seed+5);
      o.cap[i]=Math.max(0,(q-0.12)/0.88)*L.capMax*jitter*(ho?H.capacity_factor:1);
      o.lat[i]=24+(1-q)*110+(ho?H.latency_spike_ms:0);
      o.loss[i]=(q<0.15?6:q<0.3?2.5:q<0.5?0.8:0.2)+(ho?H.packet_loss:0);
      o.avail[i]=q>0.12?1:0; o.reason[i]=0;
      o.conf[i]=tun>=0?0.85:clamp(0.22+0.2*R.urban[i]+0.05*noise1(km/9,L.seed+9),0,1);
    }
  }
  // --- Starlink: obstruction / availability model ---
  { const o=S.links.sl, rain=P.weather==='rain';
    for (let i=0;i<N;i++){ const km=R.km[i]; const tun=R.tunnel[i]>=0;
      let sky = 1 - 0.85*R.canopy[i] - Math.min(0.55, R.cutting[i]/22) - 0.18*R.urban[i] - 0.06*noise1(km/0.7,77) - (rain?0.05:0);
      if (tun) sky=0; sky=clamp(sky,0,1);
      const temp = !tun && sky>0.5 && fbm1(km/0.45,99,2)>0.80;
      let reason=0; if(tun) reason=1; else if(R.canopy[i]>0.5) reason=3; else if(R.cutting[i]>10) reason=2; else if(R.urban[i]>0.6) reason=4; else if(temp) reason=5; else if(rain) reason=6;
      const avail = !tun && sky>=0.35;
      o.q[i]=sky; o.avail[i]=avail?1:0; o.reason[i]=reason;
      o.cap[i]=avail? 230*Math.pow(sky,1.4)*(rain?0.8:1)*(0.85+0.3*noise1(km/0.25,88))*(temp?0.3:1) : 0;
      o.lat[i]=27+(1-sky)*35+6*noise1(km/0.2,66)+(temp?40:0);
      o.loss[i]=avail?(sky<0.6?1.2:0.3)+(temp?3:0):100;
      o.conf[i]=tun?0.9:0.35; o.rsrp[i]=NaN; o.sinr[i]=NaN;
    } }
  // --- link manager (multi-WAN) ---
  const W=CFG.wan, ids=LINKS.map(l=>l.id);
  for (let i=0;i<N;i++){
    let mask=0, sum=0, best=-1, bs=-1, bestCell=-1, bcs=-1, minLat=1e9, minLoss=1e9, wl=0, wsum=0, confAcc=0, confN=0;
    ids.forEach((id,k)=>{ const o=S.links[id]; const nc=clamp(o.cap[i]/250,0,1), nl=clamp(1-o.lat[i]/200,0,1), np=clamp(1-o.loss[i]/10,0,1), st=o.ho[i]?0.3:1;
      const sc = o.avail[i] ? 0.35*nc+0.25*nl+0.20*np+0.10*st+0.10*o.conf[i] : 0; o.score[i]=sc;
      if (sc>bs){bs=sc;best=k;} if (id!=='sl'&&sc>bcs){bcs=sc;bestCell=k;} });
    const usable = k => S.links[ids[k]].avail[i] && S.links[ids[k]].score[i]>=W.minimum_link_score;
    let chosen=[];
    switch(P.policy){
      case 'FAILOVER': if(best>=0&&usable(best)) chosen=[best]; break;
      case 'CELLULAR_PRIMARY_STARLINK_BACKUP': if(bestCell>=0&&usable(bestCell)) chosen=[bestCell]; else if(usable(3)) chosen=[3]; break;
      case 'STARLINK_PRIMARY_CELLULAR_BACKUP': if(usable(3)) chosen=[3]; else if(bestCell>=0&&usable(bestCell)) chosen=[bestCell]; break;
      default: chosen=ids.map((_,k)=>k).filter(usable);
    }
    if (!chosen.length && best>=0 && S.links[ids[best]].avail[i]) chosen=[best]; // degraded: hang on to whatever exists
    for (const k of chosen){ const o=S.links[ids[k]]; mask|=1<<k; sum+=o.cap[i]; minLat=Math.min(minLat,o.lat[i]); minLoss=Math.min(minLoss,o.loss[i]); wl+=o.lat[i]*o.cap[i]; wsum+=o.cap[i]; confAcc+=o.conf[i]; confN++; }
    let cap=0, lat=0, loss=100;
    if (chosen.length){
      if (P.policy==='PACKET_BONDING'){ cap=W.bonding_efficiency*sum*W.congestion_factor; lat=minLat+5; loss=minLoss*0.7; }
      else if (P.policy==='WEIGHTED_LOAD_BALANCING'){ cap=sum*0.78; lat=wsum>0?wl/wsum:minLat; loss=minLoss; }
      else { cap=sum; lat=minLat; loss=minLoss; }
    }
    S.active[i]=mask; S.bonded[i]=cap; S.lat[i]=lat; S.loss[i]=loss; S.conf[i]=confN?confAcc/confN:0;
    // --- passenger Wi-Fi demand model ---
    const load = 0.55+0.35*(0.5+0.5*Math.sin(R.km[i]/90)); const pax=CFG.wifi.passengers*load, active=pax*CFG.wifi.active_share;
    const wan=Math.min(cap, CFG.wifi.ap_capacity_mbps); const perUser=active>0?Math.min(CFG.wifi.per_user_demand_mbps*2.5, wan*0.85/active):0;
    let score = chosen.length ? 100*(0.55*Math.min(1,perUser/3)+0.25*clamp(1-lat/250,0,1)+0.20*clamp(1-loss/8,0,1)) : 0;
    if (cap<1) score=0;
    S.passengers[i]=pax; S.perUser[i]=perUser; S.wifi[i]=score;
    S.wifiClass[i]= score>=80?0: score>=60?1: score>=40?2: score>=15?3:4;
  }
  simulate.version++;
}
simulate.version=0;
simulate();

/* ================= classification for colouring ================= */
function classOf(metric, link, i){
  if (metric==='conf') return 4; // handled by sequential ramp
  if (link==='wan'){
    switch(metric){
      case 'wifi': { const c=S.wifiClass[i]; return c<=1?0:c===2?1:c===3?2:3; }
      case 'capacity': return capClass(S.bonded[i]);
      case 'latency': return S.active[i]?latClass(S.lat[i]):3;
      case 'loss': return S.active[i]?lossClass(S.loss[i]):3;
      case 'avail': return S.active[i]?0:3;
      default: { const c=S.wifiClass[i]; return c<=1?0:c===2?1:c===3?2:3; }
    }
  }
  const o=S.links[link];
  switch(metric){
    case 'capacity': return o.avail[i]?capClass(o.cap[i]):3;
    case 'latency': return o.avail[i]?latClass(o.lat[i]):3;
    case 'loss': return o.avail[i]?lossClass(o.loss[i]):3;
    case 'avail': return o.avail[i]?0:3;
    case 'wifi': return o.avail[i]?capClass(o.cap[i]):3;
    default: { const q=o.q[i]; return !o.avail[i]?3: q>=0.6?0: q>=0.4?1: q>=0.2?2:3; }
  }
}
const capClass = c => c>=50?0:c>=20?1:c>=5?2:3;
const latClass = l => l<=45?0:l<=80?1:l<=150?2:3;
const lossClass = p => p<=0.5?0:p<=2?1:p<=5?2:3;
function confStep(c){ return c>=0.9?4:c>=0.7?3:c>=0.4?2:c>=0.1?1:0; }

/* model reasoning for the inspection popup: the terms that produced a sample's value */
function explain(id, i){
  const L=LINKS.find(l=>l.id===id), km=R.km[i], out=[];
  if (L.type==='cellular'){ const o=S.links[id], s=SITES[id][o.serving[i]], sd=s?Math.hypot(s.x-R.x[i],s.y-R.y[i]):0;
    out.push(['prior (synthetic, stands in for Ofcom grid)', (0.62+0.25*(fbm1(km/5,L.seed,4)*2-1)).toFixed(2)]);
    if(R.urban[i]>0.01) out.push(['urban density boost', '+'+(0.22*R.urban[i]).toFixed(2)]);
    const d=dip(km,L.dipF); if(d>0.005) out.push(['rural weak zone', '−'+d.toFixed(2)]);
    const c=0.28*Math.min(1,R.cutting[i]/10); if(c>0.005) out.push(['cutting shadow ('+R.cutting[i].toFixed(0)+' m)', '−'+c.toFixed(2)]);
    const dp=0.06*Math.max(0,sd-3); if(dp>0.005) out.push(['serving cell '+sd.toFixed(1)+' km away', '−'+dp.toFixed(2)]);
    if(S.params.vehicle!=='EXTERNAL_ROOFTOP_ANTENNA') out.push(['carriage penetration loss', '−0.18']);
    if(R.tunnel[i]>=0) out.push(['tunnel: '+TUNNELS[R.tunnel[i]][2], TUNNELS[R.tunnel[i]][3]?'in-tunnel DAS assumed → 0.52':'no coverage → 0.04']);
    if(o.ho[i]) out.push(['handover in progress', '+'+CFG.handover.latency_spike_ms+' ms, capacity ×'+CFG.handover.capacity_factor]);
  } else { const o=S.links.sl;
    out.push(['sky visibility score', o.q[i].toFixed(2)]);
    if(R.canopy[i]>0) out.push(['station canopy mask','−'+(0.85*R.canopy[i]).toFixed(2)]);
    if(R.cutting[i]>0.5) out.push(['cutting horizon ('+R.cutting[i].toFixed(0)+' m)','−'+Math.min(0.55,R.cutting[i]/22).toFixed(2)]);
    if(R.urban[i]>0.01) out.push(['urban obstruction','−'+(0.18*R.urban[i]).toFixed(2)]);
    if(S.params.weather==='rain') out.push(['weather scenario: heavy rain','−0.05 sky, capacity ×0.8']);
    out.push(['reason code', REASONS[o.reason[i]]]);
  }
  return out;
}
const unproj = (x,y) => [LAT0+y/KY, LON0+x/KX];
window.__SIM = { CFG, STATIONS, TUNNELS, LINKS, REASONS, CLASS_NAMES, WIFI_CLASSES, R, S, SITES, simulate, classOf, confStep, clamp, explain, unproj };
